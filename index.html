<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safeway Experience Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f5;--panel:#fff;--ink:#222;--mut:#6b6b6b;--line:#e4e2e0;--red:#9b0000;--maroon:#5e1b07;--soft:#ffe3e3;--ok:#1f8a4c;--warn:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#181514;--panel:#221e1d;--ink:#f1ebe8;--mut:#a39a95;--line:#3a3331;--soft:#3a1c1e;--red:#ff6b6b}}
:root[data-theme=dark]{--bg:#181514;--panel:#221e1d;--ink:#f1ebe8;--mut:#a39a95;--line:#3a3331;--soft:#3a1c1e;--red:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px 'Nunito Sans',system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:200px 1fr;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);color:var(--ink);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
nav h1{font-family:Poppins,sans-serif;color:var(--red);font-weight:600;font-size:17px;margin:0 8px 16px;line-height:1.2}nav h1 small{display:block;font-weight:400;opacity:.65;font-size:12px}
nav button{background:none;border:0;color:var(--ink);text-align:left;padding:10px 12px;border-radius:99px;cursor:pointer;transition:.15s}
nav button:hover{background:var(--bg)}nav button.on{background:var(--soft);color:var(--red);font-weight:700}
.role{margin-top:auto;padding:8px;font-size:12px;color:var(--mut)}.role select{margin-top:4px;border-radius:99px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h2{font-family:Poppins,sans-serif;font-weight:500;margin:0;font-size:18px;flex:1}
.btn{border:1px solid var(--red);color:var(--red);background:var(--panel);padding:8px 16px;border-radius:99px;font-weight:700;cursor:pointer;transition:.15s}.btn:hover{border-color:var(--red)}
.btn.p{background:var(--red);color:#fff}.btn.p:hover{filter:brightness(1.1)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eee;color:#555}
.b-Draft{background:#e9e5e2;color:#5b524e}.b-Scheduled{background:#fdf0d4;color:var(--warn)}.b-Active{background:#d9f2e3;color:var(--ok)}.b-Expired{background:#f6d9d9;color:var(--red)}.b-InReview{background:#e1e9fb;color:#2b5bd7}
.work{flex:1 1 auto;display:grid;grid-template-columns:minmax(340px,1fr) 400px;min-height:0;height:0;overflow:hidden}
.left{overflow-y:scroll;overflow-x:hidden;padding:16px 18px 120px;border-right:1px solid var(--line);min-height:0;height:100%;max-height:100%;overscroll-behavior:contain;scrollbar-gutter:stable;touch-action:pan-y}
.right{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 14px 80px;background:var(--bg);min-height:0;scrollbar-gutter:stable}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font-weight:600;background:none;border:0;padding:8px 10px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}.tabs button.on{color:var(--red);border-color:var(--red);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib .card{cursor:grab;margin:0;display:flex;flex-direction:column;gap:6px;transition:.15s}.lib .card:hover{border-color:var(--red);transform:translateY(-1px)}
.lib .ic{height:54px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:24px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:var(--soft);border-radius:8px;padding:10px}.kpi b{font-size:18px;display:block}
.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.assets button{border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;cursor:pointer;background:none}.assets button.on{border-color:var(--red)}
.assets i{display:grid;place-items:center;height:64px;font-size:26px;font-style:normal}.assets span{display:block;font-size:11px;padding:3px;color:var(--mut)}
/* phone */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px}.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font-weight:600;cursor:pointer}.seg button.on{background:var(--red);color:#fff}
.phone{width:320px;height:640px;border-radius:44px;background:#111;padding:10px;position:relative;flex:none;box-shadow:0 12px 30px #0003;transition:.25s}
.phone.android{border-radius:28px;width:316px}
.phone .scr{background:#fff;color:#231f1e;height:100%;border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
.android .scr{border-radius:20px}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#111;border-radius:20px;z-index:3}.android .notch{width:14px;height:14px;top:20px;border-radius:50%}
.sb{height:44px;background:#ffd6d6;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px 4px;font-size:11px;font-weight:700;flex:none}
.sh{background:#ffd6d6;padding:2px 12px 8px;flex:none}.sh div{background:#fff;border-radius:99px;padding:6px 12px;font-size:11px;color:#777;display:flex;justify-content:space-between}
.feed{flex:1;overflow:auto;padding-bottom:10px}
.tab{display:flex;justify-content:space-around;background:#f7f7f7;border-top:1px solid #eee;padding:8px 0 12px;font-size:10px;color:#777;flex:none}.tab b{color:#000}
.mc{position:relative;margin:8px 10px;border-radius:12px;cursor:pointer;outline:2px solid transparent;transition:.15s}
.mc:hover{outline-color:#b3121b55}.mc.sel{outline-color:var(--red)}.mc.over{outline:2px dashed var(--red);background:#b3121b12}
.mc .tools{display:none;position:absolute;top:-10px;right:4px;gap:2px;z-index:2;background:#fff;border:1px solid #ddd;border-radius:8px;padding:1px}
.mc.sel .tools{display:flex}.tools button{border:0;background:none;cursor:pointer;padding:2px 6px;font-size:12px}
.mc h4{font-family:Poppins,sans-serif;font-weight:500;margin:2px 4px 8px;font-size:16px}.mc h4:after{content:"View all";float:right;font:600 11px "Nunito Sans";color:#9b0000;text-decoration:underline;margin-top:4px}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 4px}.ig div{text-align:center;font-size:9px}.ig i{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;background:#f4efeb;font-style:normal;font-size:22px;margin-bottom:3px}
.bn{font-family:Poppins,sans-serif;border-radius:20px;padding:16px;color:#fff;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:4px}.bn b{font-size:18px}.bn u{font:600 12px "Nunito Sans"}
.sp{font-family:Poppins,sans-serif;display:grid;grid-template-columns:1fr 1fr;border-radius:20px;overflow:hidden;min-height:110px}.sp>div{padding:14px;display:flex;flex-direction:column;justify-content:center;gap:4px}.sp b{font-size:15px}.sp u{font:600 12px "Nunito Sans"}.sp>i{display:grid;place-items:center;font-size:44px;font-style:normal}
.cr{display:flex;gap:8px;overflow:hidden;padding:0 2px}.cr.t div{flex:none;width:92px;border:1px solid #eee;border-radius:16px;padding:8px;text-align:center;font-size:10px;background:#fff}.cr.t i{display:block;font-size:30px;font-style:normal}
.gv{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 2px}.pc{border:1px solid #eee;border-radius:16px;padding:8px;background:#fff;font-size:11px;display:flex;flex-direction:column;gap:2px;min-width:0}.pc i{font-style:normal;font-size:34px;background:#f4efeb;border-radius:12px;display:grid;place-items:center;aspect-ratio:1;margin-bottom:4px}.pc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc span{color:#666}.pc em{font-style:normal;color:#9b0000;border:1px solid #9b0000;border-radius:99px;text-align:center;padding:2px;font-weight:700;margin-top:4px}.cr .pc{flex:none;width:calc((100% - 8px*var(--g))/var(--n))}.bs{flex:none;width:82%;border-radius:16px;overflow:hidden;position:relative;color:#fff}.bs b{position:absolute;left:10px;bottom:8px;font-size:12px;text-shadow:0 1px 3px #0009}.bs>div{color:#fff}.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.ac{border:2px solid transparent;background:var(--panel);border-radius:16px;padding:6px;cursor:pointer;text-align:left;box-shadow:0 0 0 1px var(--line)}.ac.on{border-color:var(--red)}.ac>div{border-radius:10px;overflow:hidden}.ac b{display:block;margin-top:6px;font-size:12px}.ac small{color:var(--mut)}.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 10px;cursor:pointer;font-weight:600}.chip.on{background:var(--soft);border-color:var(--red);color:var(--red)}.lock{position:absolute;top:6px;left:6px;background:#0008;color:#fff;font-size:9px;padding:2px 6px;border-radius:99px}
.empty{padding:40px 20px;text-align:center;color:#999;font-size:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw}.toast.on{opacity:1}
@media(max-width:1000px){body{overflow:auto}main{overflow:visible}.work{height:auto;overflow:visible}.left{height:auto;max-height:none;overflow:visible}#app{grid-template-columns:1fr;height:auto}nav{flex-direction:row;flex-wrap:wrap}.role{margin:0}.work{grid-template-columns:1fr}.left{border:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* v4: AI Copilot + Shoppable Stories */
.ai-bar{display:flex;gap:8px;align-items:center;flex:1;max-width:520px;margin:0 10px}
.ai-bar input{margin:0;background:var(--bg)}
.ai-drawer{position:fixed;right:18px;top:70px;width:min(430px,calc(100vw - 36px));max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px #0004;padding:14px;z-index:20;display:none}
.ai-drawer.on{display:block}.ai-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.ai-msg{background:var(--bg);border-radius:12px;padding:10px;margin:10px 0;font-size:12px}
.ai-thinking{display:flex;gap:5px;align-items:center;color:var(--mut);font-size:12px}.ai-thinking i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1s infinite alternate}.ai-thinking i:nth-child(2){animation-delay:.2s}.ai-thinking i:nth-child(3){animation-delay:.4s}@keyframes pulse{to{opacity:.2}}
.story-cover{min-height:170px;border-radius:20px;overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#6f170f,#d65c42);cursor:pointer}
.story-cover .play{font-size:42px}.story-cover .story-copy{position:absolute;left:14px;bottom:14px}.story-cover .story-copy b{display:block;font:600 17px Poppins}.story-cover .story-copy span{font-size:11px}
.story-modal{position:fixed;inset:0;background:#000c;z-index:30;display:none;place-items:center;padding:18px}.story-modal.on{display:grid}
.story-phone{width:min(360px,92vw);height:min(700px,88vh);background:#181818;border-radius:30px;overflow:hidden;position:relative;color:#fff;box-shadow:0 20px 70px #0008}
.story-frame{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:linear-gradient(160deg,#742014,#e88957)}
.story-progress{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:4px;z-index:2}.story-progress i{height:3px;flex:1;background:#ffffff55;border-radius:99px}.story-progress i.on{background:#fff}
.story-close{position:absolute;right:14px;top:24px;z-index:3;border:0;background:#0006;color:#fff;border-radius:99px;width:32px;height:32px;cursor:pointer}
.story-nav{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;z-index:1}.story-nav button{border:0;background:transparent}
.story-content{position:relative;z-index:2;pointer-events:none}.story-content h3{font:600 24px Poppins;margin:0 0 6px}.story-content p{margin:0 0 14px}
.product-sticker{pointer-events:auto;background:#fff;color:#222;border-radius:14px;padding:9px 11px;display:inline-flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 5px 18px #0004;cursor:pointer;border:0}.product-sticker small{display:block;color:#777;font-weight:600}
.frames{display:flex;flex-direction:column;gap:8px}.frame-row{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px}.frame-thumb{height:54px;border-radius:9px;background:linear-gradient(145deg,#7d2117,#e6905f);display:grid;place-items:center;color:#fff;font-size:20px}


.analytics-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--bg);padding:6px 8px;border-radius:8px;word-break:break-all}
.track-preview{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto}

.content-item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--panel)}
.content-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-preview{display:flex;gap:8px;overflow:hidden;padding:4px 2px}
.item-preview>div{flex:none;min-width:82px;max-width:110px;border:1px solid #eee;border-radius:14px;padding:9px 7px;background:#fff;text-align:center;font-size:10px;color:#222}
.item-preview i{display:grid;place-items:center;font-style:normal;font-size:24px;height:34px}
.item-preview b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* v9 RBAC + approvals */
.approval-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.approval-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel)}
.approval-card h4{margin:0 0 5px;font-family:Poppins;font-weight:600}
.meta{font-size:11px;color:var(--mut);line-height:1.6}
.role-pill{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--soft);font-size:11px;font-weight:700}
.audit{font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.user-row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){.user-row{grid-template-columns:1fr}.approval-grid{grid-template-columns:1fr}}

.approval-toolbar{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px;margin:10px 0 14px}
.approval-list{display:flex;flex-direction:column;gap:9px}
.approval-row{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:11px}
.approval-row-top{display:grid;grid-template-columns:minmax(170px,1.4fr) minmax(120px,.8fr) minmax(110px,.7fr) minmax(135px,.9fr);gap:10px;align-items:center}
.approval-component{display:flex;gap:9px;align-items:center}
.approval-thumb{width:62px;height:42px;border-radius:8px;background:linear-gradient(135deg,#f3d7d1,#fff1dc);display:grid;place-items:center;font-size:21px;flex:none}
.approval-details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.approval-row.open .approval-details{display:block}
.mini-preview{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;display:flex;gap:7px;overflow:hidden;margin-bottom:10px}
.mini-preview>div{min-width:70px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;font-size:10px}
@media(max-width:800px){.approval-toolbar,.approval-row-top{grid-template-columns:1fr}.approval-thumb{width:52px}}

.admin-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.admin-tabs button{border:0;background:none;padding:9px 12px;color:var(--mut);cursor:pointer;font-weight:700;border-bottom:2px solid transparent}
.admin-tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.role-table-head,.role-row{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;align-items:center}
.role-table-head{padding:7px 10px;color:var(--mut);font-size:10px;font-weight:800;text-transform:uppercase}
.role-row{padding:10px;border-top:1px solid var(--line)}
.danger{color:var(--red);border-color:var(--red)}
@media(max-width:700px){.role-table-head{display:none}.role-row{grid-template-columns:1fr}.admin-tabs{overflow:auto}}

.work.fullpage{display:block;height:auto;overflow:auto}
.work.fullpage .left{height:auto;max-height:none;overflow:visible;border-right:0;padding-bottom:80px}
.work.fullpage .right{display:none}
</style></head>
<body><div id="app">
<nav id="nav"></nav>
<main>
<header><h2 id="ttl">Layout Builder</h2>
<div class="ai-bar"><input id="aiQuick" placeholder="✦ Ask AI to build layout…"><button class="btn p" id="aiOpen">Generate</button></div>
<span id="stb" class="badge"></span><button class="btn" id="prev">Preview link</button><button class="btn p" id="pub"></button></header>
<div class="work" id="work"><section class="left" id="left"></section>
<section class="right">
<div class="row" style="flex:none;gap:8px;width:auto">
<div class="seg" id="plat"><button data-v="ios" class="on">iPhone 15 Pro</button><button data-v="android">Pixel</button></div>
</div>

<div class="phone" id="phone"><div class="notch"></div><div class="scr"><div class="sb"><span>11:09</span><span>5G ▮▮▮</span></div><div class="sh"><div><span>🔍 Search products, deals…</span><span>✦ AI</span></div></div><div class="feed" id="feed"></div><div class="tab"><span><b>Home</b></span><span>Member</span><span>Deals</span><span>My Lists</span><span>More</span></div></div></div>
</section></div></main></div>
<aside class="ai-drawer" id="aiDrawer">
<div class="ai-head"><div><b>✦ Experience Copilot</b><div style="font-size:11px;color:var(--mut)">Describe the experience, not the components.</div></div><button class="btn" id="aiClose">Close</button></div>
<div class="ai-msg">Try: “Create a 3-row layout for a rainy weekend featuring soup and comfort snacks, targeted at Gold members.”</div>
<label>What should the page accomplish?</label>
<input id="aiPrompt" value="Create a 3-row layout for a rainy weekend featuring soup and comfort snacks, targeted at Gold members">
<div id="aiState" style="margin:10px 0"></div>
<button class="btn p" id="aiGenerate" style="width:100%">Generate proposed layout</button>
<div id="aiProposal"></div>
</aside>
<div class="story-modal" id="storyModal"><div class="story-phone">
<div class="story-progress" id="storyProgress"></div><button class="story-close" id="storyClose">✕</button>
<div class="story-frame" id="storyFrame"></div><div class="story-nav"><button id="storyPrev" aria-label="Previous"></button><button id="storyNext" aria-label="Next"></button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const TYPES={story:{n:'Shoppable Story / Quick Look',e:'▯',d:'Immersive 9:16 media + product stickers'},icon:{n:'Circular Icon Grid',e:'⭕',d:'4-up category circles'},banner:{n:'Full-Width Banner',e:'🖼️',d:'Uses a library banner'},split:{n:'Split Promotional Card',e:'◧',d:'Text + library banner'},bcar:{n:'Banner Carousel (1.2)',e:'🎞️',d:'Swipeable library banners'},carousel:{n:'Tile Carousel',e:'🎠',d:'Compact category tiles'},car25:{n:'Product Carousel 2.5',e:'🃏',d:'2.5 product cards visible'},car35:{n:'Product Carousel 3.5',e:'🗂️',d:'3.5 product cards visible'},grid:{n:'Product Grid View',e:'▦',d:'2-column product grid'}};
const USES_ASSET=['banner','split','bcar'];
const CONTRACT={
 banner:{kind:'static_single',label:'Image + deep link',title:false,copy:false},
 split:{kind:'static_single',label:'Image + copy + deep link',title:true,copy:true},
 bcar:{kind:'static_multi',label:'Multiple images + deep links',title:true},
 icon:{kind:'static_multi',label:'Image + label + deep link items',title:true},
 carousel:{kind:'static_multi',label:'Image + label + deep link items',title:true},
 car25:{kind:'products',label:'Product IDs',title:true},
 car35:{kind:'products',label:'Product IDs',title:true},
 grid:{kind:'products',label:'Product IDs',title:true},
 story:{kind:'story',label:'Media frames + Product IDs',title:true}
};
const contract=c=>CONTRACT[c.type]||{kind:'static_multi',label:'Content'};

$('#pub').onclick=()=>{
 if(S.role=='Editor'){
   if(!S.review){S.review=true;const a={id:Date.now(),page:'Home browse page',version:'Draft v'+(S.approvals.length+1),by:'Current Editor',at:new Date().toLocaleString(),components:S.comps.length,window:'Uses configured page/component schedule',status:'Pending',decision:''};S.approvals.push(a);S.audit.push({at:new Date().toLocaleString(),text:`Editor submitted ${a.page} (${a.version}) for approval`});toast('Submitted page version for approval')}
 } else {
   S.published=true;S.review=false;S.comps.forEach(c=>c.saved=true);S.audit.push({at:new Date().toLocaleString(),text:`${S.role} published current page version`});toast('Published to iOS and Android');
 }render()
};
$('#prev').onclick=()=>{const l='https://preview.safeway-xm.internal/s/'+Math.random().toString(36).slice(2,8);navigator.clipboard?.writeText(l).catch(()=>{});toast('Staging link copied: '+l)};

let storyState={c:null,i:0};
function openStory(id){const c=S.comps.find(x=>x.id==id);if(!c||c.type!='story')return;storyState={c,i:0};drawStory();$('#storyModal').classList.add('on')}
function drawStory(){const c=storyState.c,fs=c?.storyFrames||[];if(!fs.length){$('#storyFrame').innerHTML='<div class="story-content"><h3>No frames yet</h3><p>Add frames in Content configuration.</p></div>';return}storyState.i=Math.max(0,Math.min(storyState.i,fs.length-1));const f=fs[storyState.i],p=CAT.find(x=>x.id==f.pid);$('#storyProgress').innerHTML=fs.map((_,i)=>`<i class="${i<=storyState.i?'on':''}"></i>`).join('');$('#storyFrame').innerHTML=`<div class="story-content"><div style="font-size:12px;margin-bottom:8px">QUICK LOOK · ${storyState.i+1}/${fs.length}</div><h3>${f.name}</h3><p>${storyState.i==0?'Rainy-day picks, ready in a few taps.':'Keep shopping without leaving the story.'}</p>${p?`<button class="product-sticker" data-storyadd="${p.id}"><span style="font-size:24px">${p.e}</span><span>${p.l}<small>$${p.price.toFixed(2)} · Tap to add</small></span></button>`:`<div class="product-sticker">⚠ Product ${f.pid||''} not found</div>`}</div>`}
function closeStory(){$('#storyModal').classList.remove('on')}
$('#storyClose').onclick=closeStory;$('#storyPrev').onclick=()=>{storyState.i--;drawStory()};$('#storyNext').onclick=()=>{if(storyState.i<(storyState.c?.storyFrames||[]).length-1){storyState.i++;drawStory()}else closeStory()};
$('#storyModal').addEventListener('click',e=>{const a=e.target.closest('[data-storyadd]');if(a)toast('Added Product '+a.dataset.storyadd+' to cart')});

function openAI(seed=''){if(seed)$('#aiPrompt').value=seed;$('#aiDrawer').classList.add('on')}
$('#aiOpen').onclick=()=>openAI($('#aiQuick').value);
$('#aiQuick').addEventListener('keydown',e=>{if(e.key==='Enter')openAI(e.target.value)});
$('#aiClose').onclick=()=>$('#aiDrawer').classList.remove('on');
$('#aiGenerate').onclick=()=>{
 const q=$('#aiPrompt').value.trim();if(!q)return toast('Describe the experience first');
 $('#aiState').innerHTML='<div class="ai-thinking">Parsing intent <i></i><i></i><i></i></div>';$('#aiProposal').innerHTML='';
 setTimeout(()=>{
   const targeting=/gold|member|target/i.test(q);
   $('#aiState').innerHTML='';
   $('#aiProposal').innerHTML=`<div class="card"><b>Proposed experience</b><p style="font-size:12px;color:var(--mut)">Intent understood: rainy/comfort merchandising → promotional hero + product rail + immersive Quick Look.</p><table><tr><td>1</td><td>Rainy Weekend hero</td><td>Static + search deep link</td></tr><tr><td>2</td><td>Comfort Food Picks</td><td>Product IDs / catalogue</td></tr><tr><td>3</td><td>Quick Look story</td><td>3 shoppable frames</td></tr></table>${targeting?'<p style="font-size:12px"><b>Targeting detected:</b> Gold members <span class="badge">Future capability</span><br><span style="color:var(--mut)">Layout can be generated now; targeting will not be applied.</span></p>':''}<button class="btn p" id="aiApply" style="width:100%">Apply proposed layout</button></div>`;
   $('#aiApply').onclick=()=>{
     const b=mk('banner',{title:'Rainy Weekend Comfort',sub:'Cozy favorites for a rainy weekend.',link:'search',linkVal:'safeway://search?s=soup%20comfort%20snacks',saved:false});
     const p=mk('car25',{title:'Comfort Food Picks',src:'manual',idsText:'101020, 101013, 101018, 101016, 101003',saved:false});
     const st=mk('story',{title:'Rainy Day Quick Look',saved:false});
     S.comps=[b,p,st];S.sel=st.id;S.view='builder';S.tab='cfg';S.sub='content';S.review=false;S.published=false;render();$('#aiDrawer').classList.remove('on');toast('AI layout applied — 3 components created');
   };
 },700);
};

render();
</script></body></html>
