name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check entry page
        run: |
          test -s index.html
          grep -qi '<html' index.html

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No embedded script found")
          Path("/tmp/safeway-script.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/safeway-script.js
